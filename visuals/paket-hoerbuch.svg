      <text x="60" y="27" fill="#F2EEE6" opacity=".72" font-size="12">0:00</text>
      <rect x="102" y="20" width="290" height="5" rx="3" fill="#F2EEE6" opacity=".16"/>
      <rect x="102" y="20" width="99" height="5" rx="3" fill="#D4A94B"/>
      <text x="404" y="27" fill="#F2EEE6" opacity=".72" font-size="12">7:42</text>
    </g>
    <!-- Kapitel-Chips -->
    <g transform="translate(26,282)" font-size="13.5">
      <rect width="468" height="42" rx="10" fill="#D4A94B" opacity=".1" stroke="#D4A94B" stroke-opacity=".55"/>
      <text x="14" y="27" fill="#D4A94B" font-family="'Space Grotesk', Arial" font-weight="700" font-size="11" letter-spacing="1.6">KAPITEL 7</text>
      <text x="454" y="27" fill="#F2EEE6" opacity=".85" text-anchor="end">Die Beweis-Leiter</text>
      <rect y="52" width="468" height="42" rx="10" fill="#FFFFFF" opacity=".045" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="14" y="79" fill="#D4A94B" font-family="'Space Grotesk', Arial" font-weight="700" font-size="11" letter-spacing="1.6">KAPITEL 8</text>
      <text x="454" y="79" fill="#F2EEE6" opacity=".85" text-anchor="end">Der erste Monat</text>
      <rect y="104" width="468" height="42" rx="10" fill="#FFFFFF" opacity=".045" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="14" y="131" fill="#D4A94B" font-family="'Space Grotesk', Arial" font-weight="700" font-size="11" letter-spacing="1.6">KAPITEL 9</text>
      <text x="454" y="131" fill="#F2EEE6" opacity=".85" text-anchor="end">Der Schatten-Check</text>
    </g>
    <text x="26" y="446" fill="#F2EEE6" opacity=".55" font-size="11.5">Für Pendelzeit, Spaziergang oder nebenbei — alle Vorlagen bleiben</text>
    <text x="26" y="462" fill="#F2EEE6" opacity=".55" font-size="11.5">zum Ausfüllen im Handbuch.</text>
  </g>

  <!-- ═══ KOPFHÖRER (liegend, mit Bodenschatten) ═══ -->
  <ellipse cx="1090" cy="856" rx="170" ry="20" fill="url(#schatten)" filter="blur(8px)"/>
  <g transform="translate(940,620) rotate(-4)">
