<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Inter, Arial, sans-serif">
  <title>CAIO Institut — Paket 2: Handbuch + Hörbuch (27,50 € inkl. MwSt.)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECECEE"/><stop offset="1" stop-color="#DBDBDF"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283A"/><stop offset=".52" stop-color="#0D1B2A"/><stop offset="1" stop-color="#091320"/>
    </linearGradient>
    <linearGradient id="ruecken" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050B13"/><stop offset=".55" stop-color="#0E1E2D"/><stop offset="1" stop-color="#142C43"/>
    </linearGradient>
    <linearGradient id="welle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E86AB" stop-opacity="0"/><stop offset="1" stop-color="#41C9FF" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="player" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283A"/><stop offset=".6" stop-color="#0D1B2A"/><stop offset="1" stop-color="#0A1520"/>
    </linearGradient>
    <linearGradient id="balkenGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A94B"/><stop offset="1" stop-color="#B98F35"/>
    </linearGradient>
    <radialGradient id="schatten" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0D1B2A" stop-opacity=".34"/><stop offset="1" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <ellipse cx="420" cy="912" rx="270" ry="26" fill="url(#schatten)" filter="blur(9px)"/>

