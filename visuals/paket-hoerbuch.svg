      <text x="150" y="580" fill="#D4A94B" font-weight="700" font-size="21">18</text><text x="150" y="602" fill="#F2EEE6" opacity=".78" font-size="11.5" letter-spacing="1.2">Kapitel</text>
      <text x="230" y="580" fill="#D4A94B" font-weight="700" font-size="21">4</text><text x="230" y="602" fill="#F2EEE6" opacity=".78" font-size="11.5" letter-spacing="1.2">Teile</text>
      <text x="318" y="580" fill="#D4A94B" font-weight="700" font-size="21">8</text><text x="318" y="602" fill="#F2EEE6" opacity=".78" font-size="11.5" letter-spacing="1.2">Praxis-Anhänge</text>
      <text x="408" y="580" fill="#D4A94B" font-weight="700" font-size="21">5</text><text x="408" y="602" fill="#F2EEE6" opacity=".78" font-size="11.5" letter-spacing="1.2">Vorlagen</text>
