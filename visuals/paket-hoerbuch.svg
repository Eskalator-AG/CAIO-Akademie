    <path d="M52 92 a104 104 0 0 1 196 0" fill="none" stroke="#D4A94B" stroke-width="4" stroke-linecap="round" opacity=".85" transform="translate(0,4)"/>
    <rect x="22" y="164" width="46" height="84" rx="20" fill="#142433"/>
    <rect x="30" y="172" width="14" height="68" rx="7" fill="#1E3450"/>
    <rect x="232" y="164" width="46" height="84" rx="20" fill="#142433"/>
    <rect x="240" y="172" width="14" height="68" rx="7" fill="#1E3450"/>
    <rect x="34" y="196" width="22" height="30" rx="8" fill="#D4A94B" opacity=".92"/>
    <rect x="244" y="196" width="22" height="30" rx="8" fill="#D4A94B" opacity=".92"/>
    <circle cx="45" cy="211" r="4" fill="#142433"/><circle cx="255" cy="211" r="4" fill="#142433"/>
