      <rect x="84"  width="12" rx="3" y="16" height="52"/>
      <rect x="105" width="12" rx="3" y="30" height="38"/>
      <rect x="126" width="12" rx="3" y="12" height="56" fill="url(#balkenGold)"/>
      <rect x="147" width="12" rx="3" y="2"  height="66"/>
      <rect x="168" width="12" rx="3" y="24" height="44"/>
      <rect x="189" width="12" rx="3" y="8"  height="60" fill="url(#balkenGold)"/>
      <rect x="210" width="12" rx="3" y="30" height="38"/>
      <rect x="231" width="12" rx="3" y="18" height="50"/>
      <rect x="252" width="12" rx="3" y="0"  height="68" fill="url(#balkenGold)"/>
      <rect x="273" width="12" rx="3" y="26" height="42"/>
      <rect x="294" width="12" rx="3" y="10" height="58"/>
      <rect x="315" width="12" rx="3" y="34" height="34" fill="url(#balkenGold)"/>
      <rect x="336" width="12" rx="3" y="14" height="54"/>
      <rect x="357" width="12" rx="3" y="4"  height="64"/>
      <rect x="378" width="12" rx="3" y="28" height="40" fill="url(#balkenGold)"/>
      <rect x="399" width="12" rx="3" y="18" height="50"/>
      <rect x="420" width="12" rx="3" y="6"  height="62"/>
      <rect x="441" width="12" rx="3" y="32" height="36" fill="url(#balkenGold)"/>
