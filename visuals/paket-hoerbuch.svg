        <circle cx="87" cy="165" r="5.2"/><path d="M87 160 v5.2 l3.4 2"/>
        <rect x="148" y="128" width="9" height="9"/><rect x="152" y="124" width="9" height="9"/>
        <path d="M217 94 l4 3.4 6.6-6.6"/><rect x="213" y="88" width="20" height="15.5" rx="4"/>
        <path d="M281 58 v13 M281 58 l9.4 3.6 v9.4 M281 71 l9.4-5.6"/>
      </g>
      <path d="M40 178 C 140 128, 240 88, 322 40" stroke="#D4A94B" stroke-width="1.3" stroke-dasharray="3 6" opacity=".45" fill="none"/>
