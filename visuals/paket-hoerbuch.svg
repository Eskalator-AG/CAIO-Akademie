    <rect width="296" height="72" rx="18" fill="#142433" stroke="#D4A94B" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="148" y="30" fill="#F2EEE6" opacity=".65" font-size="10.5" letter-spacing="2.4" text-anchor="middle">PAKET 2 · HANDBUCH + HÖRBUCH</text>
    <text x="148" y="56" fill="#D4A94B" font-family="'Space Grotesk', Arial" font-weight="700" font-size="26" text-anchor="middle">27,50 €</text>
  </g>
</svg>
